<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benutzerprofile - Puls 180</title><link rel="stylesheet" href="/style.css"><style>.user-page{max-width:760px;margin:20px auto;padding:18px;font:15px/1.4 Arial,sans-serif}.user-page h1{font-size:27px;margin:10px 0}.user-page p{margin:8px 0 16px}.user-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.user-card{background:#153d69;color:white;border:1px solid #4d8cca;border-radius:12px;padding:12px}.user-card label{display:block;margin:0 0 7px;font-size:15px}.user-card input{display:block;box-sizing:border-box;width:100%;height:38px!important;margin:5px 0 8px!important;padding:5px 9px!important;font:16px Arial!important;background:#fff!important;color:#142536!important;border:1px solid #a9bfd9!important;border-radius:7px}.user-card button{padding:7px 13px;font:600 14px Arial;border-radius:7px;cursor:pointer}.user-page a{color:#124f91;font-weight:600;text-decoration:underline;text-underline-offset:3px}.user-page a:hover{color:#092f5a}.user-card-actions{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}.user-card .profile-info{margin:0;flex:1;min-width:140px;border:1px solid #ed7777;border-radius:7px;padding:4px 9px;font:14px/1.5 Arial}.user-card .profile-info>summary{cursor:pointer;padding:2px 0;color:#fff}.user-card .profile-info p{margin:8px 0}.user-card .profile-info td{padding:3px 10px 3px 0}.user-page #meldung{min-height:1.4em}@media(max-width:600px){.user-grid{grid-template-columns:1fr}}</style><main class="user-page"><a href="/">← Tagebuch</a><h1>Benutzer im PC-Tagebuch</h1><p>Vier getrennte Plätze. Trage jeweils den Namen aus der Handy-App ein. Vorhandene Werte bleiben erhalten.</p><div class="user-grid"><div class="user-card"><label for="name1">Benutzer 1</label><input id="name1" maxlength="40"><button type="button" data-profile="1">Speichern</button></div><div class="user-card"><label for="name2">Benutzer 2</label><input id="name2" maxlength="40"><button type="button" data-profile="2">Speichern</button></div><div class="user-card"><label for="name3">Benutzer 3</label><input id="name3" maxlength="40"><button type="button" data-profile="3">Speichern</button></div><div class="user-card"><label for="name4">Benutzer 4</label><input id="name4" maxlength="40"><button type="button" data-profile="4">Speichern</button></div></div><p id="meldung" role="status"></p><a href="/import.html">Handywerte als Datei importieren →</a></main><script src="/benutzer.js"></script></html>
